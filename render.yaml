services:
  # ---------------------------------------------------------------------------
  # Vachana Kranti Full-Stack Application Service (Node.js API + React Web SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: vachana-kranti
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vachana-kranti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: WEB_ORIGIN
        value: "*"
      - key: STORAGE_ROOT
        value: ./storage
      - key: REDIS_URL
        value: ""
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_IMAGE_PIXELS
        value: "40000000"
      - key: MAX_PDF_MB
        value: "80"
      - key: SEED_ADMIN_EMAIL
        value: admin@vachanakranti.local
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_EDITOR_EMAIL
        value: editor@vachanakranti.local
      - key: SEED_EDITOR_PASSWORD
        generateValue: true
      - key: TRUST_PROXY
        value: "true"

databases:
  # ---------------------------------------------------------------------------
  # Managed PostgreSQL Database Service on Render
  # ---------------------------------------------------------------------------
  - name: vachana-kranti-db
    databaseName: vachana_kranti
    user: vachana
    plan: free
    region: oregon
